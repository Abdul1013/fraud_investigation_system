# ============================================================================
# FILE: .github/workflows/release.yml
# PURPOSE: Verify locally, then allow a separately approved migration-first staging release.
# OWNER: Platform & Operations
# SINCE: week-34
# RELATED: scripts/aws_release.py, infra/terraform
# NOTES: Manual dispatch only. Configure required reviewers on the staging environment before enabling execution.
# ============================================================================
name: staging-release
on:
  workflow_dispatch:
    inputs:
      execute:
        description: 'Create a billable release only after explicit account/domain/cost approval'
        type: boolean
        default: false
      approval_record:
        description: 'Reference to the human billable approval; required for execution'
        type: string
        default: ''
      release_file:
        type: choice
        options: ['classpath:releases/release-a.json', 'classpath:releases/release-b.json']
        default: 'classpath:releases/release-a.json'
permissions:
  contents: read
concurrency:
  group: staging-release
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Full regression
        run: mvn -B -q verify
      - name: Install verified Terraform and run mock-only checks
        run: |
          python3 - <<'PYCODE'
          import hashlib,json,os,urllib.request,zipfile
          from pathlib import Path
          pins=json.load(open('infra/container/build-inputs.json'))
          folder=Path('.runtime/terraform');folder.mkdir(parents=True)
          archive=folder/'terraform.zip'
          urllib.request.urlretrieve('https://releases.hashicorp.com/terraform/'+pins['terraformVersion']+'/terraform_'+pins['terraformVersion']+'_linux_amd64.zip',archive)
          assert hashlib.sha256(archive.read_bytes()).hexdigest()==pins['terraformLinuxAmd64Sha256']
          with zipfile.ZipFile(archive) as source:source.extract('terraform',folder)
          (folder/'terraform').chmod(0o755)
          PYCODE
          .runtime/terraform/terraform -chdir=infra/terraform init -backend=false -input=false
          .runtime/terraform/terraform -chdir=infra/terraform validate
          .runtime/terraform/terraform -chdir=infra/terraform test
      - name: Build reviewed local application and workflow service roles
        run: |
          SOURCE_SHA=$(python3 scripts/release_source_digest.py)
          docker build --provenance=false --build-arg SOURCE_TREE_SHA="$SOURCE_SHA" -t fraud-engine:week34-review .
          docker build --provenance=false -f infra/temporal/Dockerfile.server -t fraud-temporal:week34-review .
          docker build --provenance=false -f infra/temporal/Dockerfile.schema -t fraud-temporal-schema:week34-review .
          docker build --provenance=false -f infra/keycloak/Dockerfile -t fraud-keycloak:week34-review .
          mvn -B -q -Dtest=IdentityPackagingIntegrationTest -Dpackaging.identity=true test
          mvn -B -q -Dtest=ContainerPackagingIntegrationTest -Dpackaging.run=true -Dpackaging.expectedSourceSha="$SOURCE_SHA" test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: week34-sanitized-preflight
          path: target/week34/
          retention-days: 14
  deploy:
    if: inputs.execute
    needs: preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: staging
    permissions:
      contents: read
      checks: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
      AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
      ECR_APP_REPOSITORY: ${{ vars.ECR_APP_REPOSITORY }}
      APPROVAL_RECORD: ${{ inputs.approval_record }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Require the exact branch, approval reference and semantic/build checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYCODE'
          import os,json,urllib.request
          assert os.environ['GITHUB_REF']=='refs/heads/'+os.environ['DEFAULT_BRANCH'], 'Release only the reviewed default branch'
          assert os.environ['APPROVAL_RECORD'].strip(), 'Billable approval record is required'
          url='https://api.github.com/repos/'+os.environ['GITHUB_REPOSITORY']+'/commits/'+os.environ['GITHUB_SHA']+'/check-runs?per_page=100'
          request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          runs=json.load(urllib.request.urlopen(request))['check_runs']
          for name in ['build','semantic-evaluation']:
              assert any(run['name']==name and run['head_sha']==os.environ['GITHUB_SHA'] and run['conclusion']=='success' and run['app']['slug']=='github-actions' for run in runs), 'Missing successful required check: '+name
          PYCODE
      - uses: aws-actions/configure-aws-credentials@ff717079ee2060e4bcee96c4779b553acc87447c
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: ${{ vars.AWS_ACCOUNT_ID }}
      - name: Verify AWS identity before image publication
        run: |
          aws sts get-caller-identity --output json | python3 -c 'import json,sys,os; assert json.load(sys.stdin)["Account"]==os.environ["AWS_ACCOUNT_ID"], "AWS account mismatch"'
          python3 -c 'import os; assert os.environ["ECR_APP_REPOSITORY"]==os.environ["AWS_ACCOUNT_ID"]+".dkr.ecr."+os.environ["AWS_REGION"]+".amazonaws.com/fraud-staging/app", "Registry mismatch"'
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Authenticate only the confirmed registry
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
      - id: source
        run: echo "sha=$(python3 scripts/release_source_digest.py)" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        id: image
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ env.ECR_APP_REPOSITORY }}:${{ github.sha }}-${{ github.run_id }}
          build-args: SOURCE_TREE_SHA=${{ steps.source.outputs.sha }}
          provenance: false
          sbom: false
      - name: Migrate, roll out, verify or request application rollback
        env:
          FRAUD_BILLABLE_DEPLOYMENT_APPROVED: 'yes'
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          RELEASE_FILE: ${{ inputs.release_file }}
          MIGRATION_TASK: ${{ vars.STAGING_MIGRATION_TASK_ARN }}
          SUBNET_IDS: ${{ vars.STAGING_SUBNET_IDS }}
          JOB_SECURITY_GROUP: ${{ vars.STAGING_JOB_SECURITY_GROUP }}
          API_URL: ${{ vars.STAGING_API_URL }}
        run: |
          python3 - <<'PYCODE'
          import os,subprocess
          command=['python3','scripts/aws_release.py','--execute','--account',os.environ['AWS_ACCOUNT_ID'],'--region',os.environ['AWS_REGION'],
            '--migration-task',os.environ['MIGRATION_TASK'],'--subnets',*os.environ['SUBNET_IDS'].split(),'--security-group',os.environ['JOB_SECURITY_GROUP'],
            '--image',os.environ['ECR_APP_REPOSITORY']+'@'+os.environ['IMAGE_DIGEST'],'--release-file',os.environ['RELEASE_FILE'],
            '--api-url',os.environ['API_URL'],'--approval-record',os.environ['APPROVAL_RECORD']]
          subprocess.run(command,check=True)
          PYCODE
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: week34-sanitized-staging-release
          path: .runtime/deployment/release.json
          retention-days: 14
