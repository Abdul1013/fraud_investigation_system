# ============================================================================
# FILE:        src/main/resources/application.yml
# PURPOSE:     Configure database, versioned knowledge, and explicitly selected Week 28 adapters.
# OWNER:       Platform & Operations
# SINCE:       week-26
# RELATED:     ADR-003, ADR-005, ADR-006
# NOTES:
#   - MCP, agent model calls, and approval signing are disabled or unavailable by default.
#   - Fixture embeddings remain labelled and are not evidence of semantic model quality.
#   - Secrets and accounts come from operator configuration, never request bodies.
# ============================================================================
server:
  port: 8080
spring:
  autoconfigure:
    exclude: org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
  application:
    name: fraud-investigation-engine
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/fraud}
    username: ${POSTGRES_USER:fraud}
    password: ${POSTGRES_PASSWORD:fraud}
  flyway:
    enabled: true
    locations: classpath:db/migration
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
  ai:
    mcp:
      server:
        enabled: false
    model:
      chat: none
      embedding: ${AI_EMBEDDING_MODEL:none}
    openai:
      api-key: ${OPENAI_API_KEY:local-unused}
      embedding:
        options:
          model: text-embedding-3-small
          dimensions: 1536
    vectorstore:
      pgvector:
        initialize-schema: false
knowledge:
  embedding-provider: ${EMBEDDING_PROVIDER:local}
  reports-directory: ${INGESTION_REPORTS_DIRECTORY:reports}
  retrieval:
    embedding-provider: ${RETRIEVAL_EMBEDDING_PROVIDER:fixture}
    embedding-model: ${OLLAMA_EMBEDDING_MODEL:embeddinggemma}
    answer-provider: ${RETRIEVAL_ANSWER_PROVIDER:extractive}
    answer-model: ${OLLAMA_ANSWER_MODEL:gemma3:4b}
    ollama-url: ${OLLAMA_URL:http://127.0.0.1:11434}
    classification-ceiling: C2
    minimum-similarity: 0.15
management:
  # Export requires the explicit observability profile.
  tracing:
    enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,info

# No signing key or native agent model is silently generated or selected.
decision:
  approval-key: ${APPROVAL_SIGNING_KEY:}
investigation:
  prompt-version: ${INVESTIGATION_PROMPT_VERSION:investigator-v1}
  engine: ${INVESTIGATION_ENGINE:temporal}
  model-provider: ${INVESTIGATION_MODEL_PROVIDER:disabled}
  model: ${INVESTIGATION_MODEL:qwen2.5:1.5b}

# Week 31 defaults to verified OIDC; Basic requires local-learning or test.
engine:
  security:
    mode: ${SECURITY_MODE:oidc}
    issuer: ${OIDC_ISSUER:http://localhost:8081/realms/fraud}
    audience: ${OIDC_AUDIENCE:fraud-api}
logging:
  exception-conversion-word: "%nopex"
  level:
    org.springframework.web: INFO
    org.springframework.security: INFO
    org.springframework.jdbc: INFO

# New investigations pin the complete configured release; old rows keep their original envelope.
release:
  active-file: ${AI_RELEASE_FILE:classpath:releases/release-a.json}
