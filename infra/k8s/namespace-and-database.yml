# ============================================================================
# FILE: infra/k8s/namespace-and-database.yml
# PURPOSE: Introduce a namespace, persistent local PostgreSQL and a private service.
# OWNER: Platform & Operations
# SINCE: week-34
# RELATED: docs/week34-implementation.md
# NOTES: Local Kubernetes learning only. No LoadBalancer, EKS, cloud secret or production identity.
# ============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: fraud-learning
---
apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: fraud-learning
spec:
  clusterIP: None
  selector:
    app: learning-postgres
  ports:
    - port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: learning-postgres
  namespace: fraud-learning
spec:
  serviceName: database
  replicas: 1
  selector:
    matchLabels:
      app: learning-postgres
  template:
    metadata:
      labels:
        app: learning-postgres
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: pgvector/pgvector:pg16@sha256:7b822b0aac60967beb1ea5e576b8602c94c300a157d187f385ae3e0da199b90a
          env:
            - name: POSTGRES_USER
              value: bootstrap_admin
            - name: POSTGRES_DB
              value: postgres
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: learning-database
                  key: administrator
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -U, bootstrap_admin, -d, postgres]
            periodSeconds: 5
          resources:
            requests: {cpu: 250m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 1Gi
