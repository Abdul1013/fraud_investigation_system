# ============================================================================
# FILE: observability/compose.yml
# PURPOSE: Run a private local OTLP, metrics, dashboard and trace demonstration stack.
# OWNER: Platform & Operations
# SINCE: week-32
# RELATED: application-observability.yml
# NOTES: Administrative/read ports bind loopback; no application credentials are embedded.
# ============================================================================
services:
  collector:
    image: otel/opentelemetry-collector-contrib:0.163.2
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes: ["./otel/week32-collector.yml:/etc/otelcol/config.yaml:ro"]
    ports: ["127.0.0.1:4318:4318"]
    depends_on: [tempo]
  prometheus:
    image: prom/prometheus:v3.15.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=1h"]
    volumes:
      - ./prometheus/week32-prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/week32-alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["127.0.0.1:9090:9090"]
  tempo:
    image: grafana/tempo:3.1.1
    command: ["-config.file=/etc/tempo.yml"]
    volumes: ["./tempo/week32-tempo.yml:/etc/tempo.yml:ro"]
    ports: ["127.0.0.1:3200:3200"]
  grafana:
    image: grafana/grafana:13.2.4
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:3000:3000"]
