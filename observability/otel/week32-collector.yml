# ============================================================================
# FILE: observability/otel/week32-collector.yml
# PURPOSE: Accept OTLP and remove unrestricted attributes before local telemetry storage.
# OWNER: Platform & Operations
# SINCE: week-32
# RELATED: observability/compose.yml
# NOTES: Only allowlisted span/event fields survive; exception messages and raw URLs are removed.
# ============================================================================
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 128
    spike_limit_mib: 32
  transform/privacy:
    error_mode: propagate
    trace_statements:
      - context: resource
        statements:
          - keep_keys(resource.attributes, ["service.name"])
      - context: span
        statements:
          - keep_keys(span.attributes, ["fraud.release", "fraud.outcome", "fraud.prompt.version", "fraud.model.version", "fraud.retrieval.version", "http.request.method", "http.route", "http.response.status_code", "http.method", "http.status_code", "error.type"])
          - set(span.status.message, "")
      - context: spanevent
        statements:
          - keep_keys(spanevent.attributes, ["exception.type"])
    metric_statements:
      - context: resource
        statements:
          - keep_keys(resource.attributes, ["service.name"])
  batch:
    timeout: 1s
    send_batch_size: 256
exporters:
  otlp_http/tempo:
    endpoint: http://tempo:4318
  prometheus:
    endpoint: 0.0.0.0:8889
    metric_expiration: 2m
    resource_to_telemetry_conversion:
      enabled: true
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [otlp_http/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, transform/privacy, batch]
      exporters: [prometheus]
